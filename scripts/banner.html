<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<!-- Source of docs/screenshots/banner.webp, the README header; scripts/screenshots.mjs renders it. -->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600,100&family=Inter:wght@400;500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  .banner {
    position: relative;
    width: 1280px;
    height: 400px;
    border-radius: 28px;
    overflow: hidden;
    background:
      radial-gradient(520px 380px at 330px 200px, rgba(255, 196, 102, 0.07), transparent 70%),
      radial-gradient(700px 500px at 1150px 420px, rgba(90, 110, 220, 0.18), transparent 70%),
      linear-gradient(135deg, #161d36, #070a18);
    font-family: Inter, system-ui, sans-serif;
  }
  /* Faint grooves rippling out from the record across the card. */
  .ripples { position: absolute; inset: 0; }
  .art { position: absolute; left: 70px; top: 50px; width: 470px; height: 300px; overflow: visible; }
  .text { position: absolute; left: 600px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  h1 {
    margin: 0;
    font-family: Fraunces, Georgia, serif;
    font-variation-settings: 'SOFT' 100;
    font-weight: 600;
    font-size: 132px;
    line-height: 1;
    letter-spacing: -0.02em;
    background: linear-gradient(180deg, #fff6e6 20%, #ffd27a 130%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p { margin: 18px 0 0 6px; font-size: 27px; color: #b8bdd6; }
  .tags { display: flex; gap: 10px; margin: 26px 0 0 6px; }
  .tags span {
    padding: 7px 16px;
    border-radius: 999px;
    border: 1px solid rgba(255, 210, 122, 0.35);
    color: #ffd27a;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<div class="banner" id="banner">
  <svg class="ripples" viewBox="0 0 1280 400" aria-hidden="true">
    <g fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1.5">
      <circle cx="385" cy="200" r="230"/><circle cx="385" cy="200" r="300"/><circle cx="385" cy="200" r="380"/>
      <circle cx="385" cy="200" r="470"/><circle cx="385" cy="200" r="570"/><circle cx="385" cy="200" r="680"/>
      <circle cx="385" cy="200" r="800"/><circle cx="385" cy="200" r="930"/>
    </g>
  </svg>

  <svg class="art" viewBox="0 0 470 300" aria-hidden="true">
    <defs>
      <radialGradient id="label" cx="0.35" cy="0.35" r="1">
        <stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#d97a1e"/>
      </radialGradient>
      <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#26305a"/><stop offset="1" stop-color="#121830"/>
      </linearGradient>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
      </filter>
    </defs>

    <!-- The record, half out of its sleeve: same art as the app icon. -->
    <g transform="translate(315 150)" filter="url(#shadow)">
      <circle r="142" fill="#20202c"/>
      <circle r="142" fill="none" stroke="#4a4a5c" stroke-width="3"/>
      <g stroke="#ffffff" opacity="0.07" fill="none" stroke-width="1.5">
        <circle r="131"/><circle r="122"/><circle r="113"/><circle r="104"/>
        <circle r="95"/><circle r="86"/><circle r="77"/><circle r="68"/>
      </g>
      <circle r="55" fill="url(#label)"/>
      <circle r="55" fill="none" stroke="#ffd27a" stroke-opacity="0.35" stroke-width="1.2"/>
      <path d="M0 -30 a30 30 0 0 1 0 60" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4.5" stroke-linecap="round"/>
      <circle r="9.5" fill="#0a0a10"/>
    </g>

    <!-- Sleeve -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="300" height="300" rx="10" fill="url(#sleeve)"/>
      <rect x="0.75" y="0.75" width="298.5" height="298.5" rx="9.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
      <!-- Printed artwork: a sunburst of thin amber rings, off-centre. -->
      <g fill="none" stroke="#ffd27a" stroke-width="2">
        <circle cx="110" cy="190" r="40" stroke-opacity="0.55"/>
        <circle cx="110" cy="190" r="62" stroke-opacity="0.35"/>
        <circle cx="110" cy="190" r="84" stroke-opacity="0.22"/>
        <circle cx="110" cy="190" r="106" stroke-opacity="0.12"/>
      </g>
      <circle cx="110" cy="190" r="18" fill="#ffd27a" fill-opacity="0.85"/>
      <text x="24" y="44" font-family="Inter, sans-serif" font-size="15" font-weight="500" letter-spacing="3" fill="#ffffff" fill-opacity="0.55">SIDE A</text>
    </g>
  </svg>

  <div class="text">
    <h1>Jukebox</h1>
    <p>Your Discogs collection, beautifully browsable.</p>
    <div class="tags"><span>Self-hosted</span><span>Works offline</span><span>Open source</span></div>
  </div>
</div>
</body>
</html>
