name: Discogs contract

# Refreshes the Discogs contract fixtures from the live API on the runner and
# reruns the hermetic contract tests (src/api/discogs-contract.test.ts) against
# the fresh payloads. A failure means Discogs changed a shape the app parses.
# Nothing is committed: the fixtures carry live data (marketplace values,
# collection counts) that churns daily, so a committed copy would only ever be
# a permanently-dirty PR. The committed fixtures stay the frozen offline
# baseline for PR CI; this job is purely the live red/green check.
on:
  schedule:
    # 03:00 UTC, daily
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh fixtures + run contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh Discogs fixtures
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: |
          if [ -z "$DISCOGS_TOKEN" ]; then
            echo "::warning::DISCOGS_TOKEN secret is missing; skipping fixture refresh (running against committed fixtures). Add the secret to get live signals."
            exit 0
          fi
          node scripts/refresh-discogs-fixtures.mjs

      - name: Run tests against the refreshed fixtures
        run: npm test

      - name: Guidance when the contract broke
        if: failure()
        run: |
          echo "::error::Discogs may have changed a shape we parse. Run 'DISCOGS_TOKEN=... npm run fixtures' locally, update the parsers, then commit the refreshed fixtures."