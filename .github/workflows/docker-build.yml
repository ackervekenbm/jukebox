name: Build & publish image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'eslint.config.js'
      - '.dockerignore'
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'eslint.config.js'
      - '.dockerignore'
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: jukebox:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot container
        run: docker run -d --name smoke -p 8080:3000 jukebox:smoke

      - name: Wait for /api/health
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health | grep -q '"ok":true'; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server did not become healthy in 60s"
          exit 1

      - name: Assert PWA cache headers
        run: |
          set -e
          curl -fsSI http://127.0.0.1:8080/index.html | grep -qi '^cache-control: no-cache'
          curl -fsSI http://127.0.0.1:8080/sw.js | grep -qi '^cache-control: no-cache'
          asset=$(curl -fsS http://127.0.0.1:8080/index.html | grep -o '/assets/[^"]*\.js' | head -1)
          echo "checking $asset"
          test -n "$asset"
          curl -fsSI "http://127.0.0.1:8080$asset" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          echo "cache headers ok"

      - name: Dump container logs
        if: failure()
        run: docker logs smoke

  build:
    # Build each architecture natively (no QEMU emulation): amd64 on the
    # x86 runner, arm64 on GitHub's native arm64 runner.
    needs: smoke
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve build metadata
        # Commit timestamp, straight from the checkout. head_commit is only
        # present on push events, so manual (workflow_dispatch) builds would
        # otherwise ship an empty BUILD_TIME and the Settings footer would
        # drop its date. %cI is strict ISO-8601 with the committer's offset.
        run: echo "BUILD_TIME=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.platform }})
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME }}
            GITHUB_REPOSITORY=${{ github.repository }}
          # Plain single-arch images (no SBOM/provenance attestations) so the
          # manifest job can amend them into a multi-arch index.
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:latest-${{ matrix.arch }}
            ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}

  manifest:
    # Combine the per-arch images into a single multi-arch index so the
    # plain tags (:latest and :<sha>) resolve to the right variant per host.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          set -e
          IMAGE="${{ env.IMAGE }}"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          docker manifest create "$IMAGE:latest" \
            --amend "$IMAGE:latest-amd64" \
            --amend "$IMAGE:latest-arm64"
          docker manifest push "$IMAGE:latest"
          docker manifest create "$IMAGE:$SHA_SHORT" \
            --amend "$IMAGE:${{ github.sha }}-amd64" \
            --amend "$IMAGE:${{ github.sha }}-arm64"
          docker manifest push "$IMAGE:$SHA_SHORT"
